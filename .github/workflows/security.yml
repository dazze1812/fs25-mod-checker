name: Security

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "23 4 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    bandit:
        name: Bandit Scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --dev --frozen

            - name: Run Bandit
              run: uv run --with bandit --with bandit-sarif-formatter bandit -r src/fs25_mod_checker -f sarif -o bandit.sarif

            - name: Upload Bandit results
              if: always()
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: bandit.sarif

    dependency-audit:
        name: Dependency Audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  enable-cache: true

            - name: Run pip-audit
              run: uv run --with pip-audit pip-audit --skip-editable --strict .

    dependency-review:
        name: Dependency Review
        if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Review dependency changes
              uses: actions/dependency-review-action@v4
