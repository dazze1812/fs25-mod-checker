name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-version:
    name: Validate Release Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches project version
        if: github.ref_type == 'tag' || github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          event_name = os.environ["GITHUB_EVENT_NAME"]
          tag_name = os.environ["RELEASE_TAG"] if event_name == "release" else os.environ["REF_NAME"]
          project_data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = project_data["project"]["version"]
          normalized_tag = tag_name[1:] if tag_name.startswith("v") else tag_name

          if normalized_tag != project_version:
              raise SystemExit(
                  f"Release tag '{tag_name}' does not match project version '{project_version}'."
              )

          print(f"Release tag '{tag_name}' matches project version '{project_version}'.")
          PY

      - name: Skip tag validation for non-release refs
        if: github.ref_type != 'tag' && github.event_name != 'release'
        run: echo "Skipping release tag validation for ${GITHUB_EVENT_NAME} on ${GITHUB_REF_NAME}."

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run unit tests
        run: uv run pytest tests/test_checker.py

  ruff:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run Ruff
        run: uv run ruff check .

  pyright:
    name: Pyright
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run Pyright
        run: uv run pyright

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Run integration tests
        run: uv run pytest tests/test_integration.py

  build-windows-executable:
    name: Build Windows Executable
    runs-on: windows-latest
    needs:
      - validate-release-version
      - ruff
      - pyright
      - unit-tests
      - integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      - name: Build Windows executable
        shell: cmd
        run: scripts\build.cmd

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/fs25-mod-checker.exe
          if-no-files-found: error

  upload-release-executable:
    name: Upload Release Executable
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    needs:
      - build-windows-executable

    steps:
      - name: Download Windows executable artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-executable
          path: dist/

      - name: Upload executable to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fs25-mod-checker.exe
